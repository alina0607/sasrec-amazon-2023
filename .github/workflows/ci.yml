# Lint the notebook and run it from top to bottom on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.15"
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock no longer matches pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      # The course requires the notebook to run from top to bottom.
      - name: Run the notebook
        run: uv run jupyter nbconvert --to notebook --execute sasrec_amazon_2023.ipynb --output-dir "$RUNNER_TEMP"
